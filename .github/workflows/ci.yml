name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore src/Geospatial.DataGateway.Api/Geospatial.DataGateway.Api.csproj
      - run: dotnet build src/Geospatial.DataGateway.Api/Geospatial.DataGateway.Api.csproj --configuration Release --no-restore

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "python[dev]"
      - run: python -m unittest discover -s python/tests -v
